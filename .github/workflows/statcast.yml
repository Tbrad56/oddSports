name: Refresh Statcast data

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Statcast leaderboard
        run: |
          mkdir -p public/statcast
          python scripts/fetch_statcast.py

      - name: Create PR if data changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update Statcast data"
          title: "Update Statcast data"
          body: "Automated Statcast data refresh"
          branch: "statcast-refresh"
          delete-branch: true